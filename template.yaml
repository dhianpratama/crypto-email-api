AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Crypto Alert API - Staging/Prod via single template

Parameters:
  Env:
    Type: String
    Description: Environment name (e.g., staging or prod)
    AllowedValues:
      - staging
      - prod
    Default: staging

Globals:
  Function:
    Timeout: 10
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 128
    Environment:
      Variables:
        SEARCH_HISTORY_TABLE: !Sub 'CryptoSearchHistory-${Env}'
        PRICE_CACHE_TABLE: !Sub 'CryptoPriceCache-${Env}'
        QUEUE_URL: !Ref CryptoEmailQueue
        DYNAMO_ENDPOINT: ''
        IS_LOCAL: 'false'
        SES_SENDER: 'dhianpratama.m@gmail.com'

Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'CryptoAlertApi-${Env}'
      StageName: Prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'CryptoAlertUserPool-${Env}'
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireNumbers: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'CryptoClient-${Env}'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH

  CryptoSearchHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'CryptoSearchHistory-${Env}'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  CryptoPriceCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'CryptoPriceCache-${Env}'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  CryptoEmailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'CryptoEmailQueue-${Env}'

  GetPriceAndQueueEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'GetPriceAndQueueEmail-${Env}'
      CodeUri: services/getPriceAndQueueEmail
      Handler: dist/handler.handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /crypto-price
            Method: post
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub 'CryptoSearchHistory-${Env}'
        - SQSSendMessagePolicy:
            QueueName: !Sub 'CryptoEmailQueue-${Env}'
      Environment:
        Variables:
          FORCE_DEPLOY: 'true'

  GetSearchHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'GetSearchHistory-${Env}'
      CodeUri: services/getSearchHistory
      Handler: dist/handler.handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /search-history
            Method: get
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub 'CryptoSearchHistory-${Env}'
      Environment:
        Variables:
          FORCE_DEPLOY: 'true'

  SendEmailFromQueueFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'SendEmailFromQueue-${Env}'
      CodeUri: services/sendEmailFromQueue
      Handler: dist/handler.handler
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt CryptoEmailQueue.Arn
      Policies:
        - SESCrudPolicy:
            IdentityName: '*'
        - DynamoDBCrudPolicy:
            TableName: !Sub 'CryptoSearchHistory-${Env}'
        - DynamoDBCrudPolicy:
            TableName: !Sub 'CryptoPriceCache-${Env}'

  FetchCryptoPricesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'FetchCryptoPrices-${Env}'
      CodeUri: services/fetchCryptoPrices
      Handler: dist/handler.handler
      Events:
        PriceTimer:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub 'CryptoPriceCache-${Env}'

Outputs:
  ApiUrl:
    Description: 'API Gateway endpoint'
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
    Export:
      Name: !Sub 'CryptoApiEndpoint-${Env}'

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool

  CognitoUserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref CognitoUserPoolClient
